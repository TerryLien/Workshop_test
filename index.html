<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>待辦清單</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <h1 class="app-title">待辦清單</h1>

      <form id="todo-form" class="todo-form" novalidate>
        <label class="sr-only" for="todo-input">新增待辦事項</label>
        <input
          id="todo-input"
          type="text"
          placeholder="新增待辦事項"
          maxlength="120"
          autocomplete="off"
        />
        <button type="submit" class="add-btn">新增</button>
      </form>

      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
      <p id="empty-state" class="empty-state">還沒有任何待辦事項,新增一個吧!</p>

      <footer class="todo-footer">
        <span id="remaining-count">未完成: 0 項</span>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
